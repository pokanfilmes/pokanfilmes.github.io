<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>if(location.protocol==='http:'&&/(^|\.)pokanfilmes\.com\.br$/.test(location.hostname)){location.replace('https://'+location.host+location.pathname+location.search+location.hash)}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141819">
<link rel="icon" type="image/png" href="../logo/icone.png">
<title>Leads · Pokan Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --preto:#1C2126; --preto-2:#141819; --preto-3:#242A30; --preto-4:#2E353C;
  --laranja:#FF5A02; --laranja-2:#FF7A33;
  --branco:#FFFFFF; --off:#F2EFEA; --cinza:#A8AFB6; --linha:rgba(255,255,255,.1);
  --novo:#FF5A02; --contato:#5BA8FF; --proposta:#E8B931; --fechado:#3FC97A; --perdido:#7C848C;
  --display:'Outfit',ui-sans-serif,system-ui,sans-serif;
  --body:'Manrope',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--preto-2);color:var(--off);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);color:var(--branco);margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--display);font-weight:600;font-size:.9rem;padding:.7rem 1.1rem;border-radius:999px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .2s,border-color .2s}
.btn-primary{background:var(--laranja);color:var(--preto-2)}
.btn-primary:hover{background:var(--laranja-2)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.25);color:var(--branco)}
.btn-ghost:hover{border-color:var(--branco)}
.btn-wa{background:#25D366;color:#0B2A17}
.btn-wa:hover{background:#3BE07A}
.btn-danger{background:transparent;border-color:rgba(255,99,99,.4);color:#FF8F8F}
.btn-danger:hover{border-color:#FF8F8F}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
label{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);margin-bottom:.35rem}
input,select,textarea{width:100%;background:var(--preto-2);border:1px solid var(--linha);border-radius:10px;padding:.7rem .8rem;color:var(--branco)}
textarea{min-height:110px;resize:vertical}
.field{min-width:0}
.logo{display:inline-flex;align-items:center;gap:.9rem}
.logo img{height:26px;width:auto;display:block}
.logo small{font-family:var(--display);font-weight:600;letter-spacing:.3em;font-size:.62rem;text-transform:uppercase;color:var(--cinza)}

/* Entrada */
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate-box{width:min(420px,100%);background:var(--preto-3);border:1px solid var(--linha);border-radius:20px;padding:2rem;display:grid;gap:1.1rem}
.gate-box p{margin:0;color:var(--cinza)}
.aviso{font-size:.85rem;color:var(--proposta);background:rgba(232,185,49,.08);border:1px solid rgba(232,185,49,.25);border-radius:10px;padding:.6rem .8rem}
.erro{color:#FF8F8F;font-size:.9rem;min-height:1.2em}

/* App */
.top{position:sticky;top:0;z-index:5;background:rgba(20,24,25,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
.top-in{max-width:1280px;margin:0 auto;padding:.9rem clamp(14px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.top-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.top-actions .btn{padding:.55rem .9rem;font-size:.82rem}
main{max-width:1280px;margin:0 auto;padding:1.4rem clamp(14px,3vw,32px) 4rem}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-bottom:1.2rem}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--preto-3);border:1px solid var(--linha);border-radius:14px;padding:.9rem 1rem;cursor:pointer;text-align:left;border-left:3px solid var(--c)}
.stat.is-on{background:var(--preto-4);border-color:var(--c)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:600;color:var(--branco);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--cinza)}
.tools{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.tools input[type=search]{flex:1;min-width:200px;border-radius:999px;padding:.65rem 1rem}
.chip{font-family:var(--display);font-weight:600;font-size:.8rem;padding:.5rem .9rem;border-radius:999px;border:1px solid var(--linha);background:transparent;color:var(--cinza);cursor:pointer}
.chip.is-on{background:var(--laranja);border-color:var(--laranja);color:var(--preto-2)}
.list{display:grid;gap:.5rem}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) 200px;gap:1rem;align-items:center;background:var(--preto-3);border:1px solid var(--linha);border-radius:14px;padding:.9rem 1rem;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:rgba(255,255,255,.25)}
.row .n{font-family:var(--display);font-weight:600;color:var(--branco);font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.82rem;color:var(--cinza);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
@media (max-width:820px){.row{grid-template-columns:1fr auto}.row .c2,.row .c3{display:none}}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:.25rem .6rem;border-radius:999px;color:var(--c);border:1px solid var(--c);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.ret{font-size:.76rem;color:var(--cinza);white-space:nowrap}
.ret.atrasado{color:#FF8F8F;font-weight:600}
.ret.hoje{color:var(--proposta);font-weight:600}
.vazio{color:var(--cinza);text-align:center;padding:3rem 1rem;border:1px dashed var(--linha);border-radius:14px}

/* Ficha */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,13,.7);display:flex;justify-content:flex-end}
.sheet-in{width:min(560px,100%);height:100%;overflow:auto;background:var(--preto);border-left:1px solid var(--linha);padding:1.4rem clamp(16px,3vw,28px) 2rem;display:grid;gap:1rem;align-content:start}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.sheet-head h2{font-size:1.5rem}
.sheet-head p{margin:.2rem 0 0;color:var(--cinza);font-size:.85rem}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--linha);background:transparent;cursor:pointer;font-size:1.1rem;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.pedido{background:var(--preto-3);border:1px solid var(--linha);border-radius:12px;padding:.8rem 1rem;white-space:pre-wrap;word-break:break-word;color:var(--off)}
.sheet-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:.4rem}
.salvo{font-size:.82rem;color:var(--fechado);min-height:1.2em}
</style>
</head>
<body>

<!-- Entrada: primeira configuração ou login -->
<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gateForm" autocomplete="on">
    <span class="logo"><img src="../logo/pokan-reduzido.png" alt="Pokan" width="454" height="120"><small>Leads</small></span>
    <h1 id="gateTitle" style="font-size:1.5rem">Entrar</h1>
    <p id="gateText">Digite a senha do painel.</p>
    <p class="aviso" id="httpAviso" hidden>Esta página está sem conexão segura (https). Evite usar em redes públicas até o certificado do site ser emitido.</p>
    <div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <div class="field" id="senha2Wrap" hidden><label for="senha2">Repita a senha</label><input id="senha2" type="password" autocomplete="new-password"></div>
    <p class="erro" id="gateErro" role="alert"></p>
    <button class="btn btn-primary" type="submit" id="gateBtn">Entrar</button>
  </form>
</div>

<!-- Painel -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <span class="logo"><img src="../logo/pokan-reduzido.png" alt="Pokan" width="454" height="120"><small>Leads</small></span>
    <div class="top-actions">
      <button class="btn btn-primary" type="button" id="novoBtn">+ Novo lead</button>
      <button class="btn btn-ghost" type="button" id="csvBtn">Exportar planilha</button>
      <button class="btn btn-ghost" type="button" id="sairBtn">Sair</button>
    </div>
  </div></header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input type="search" id="busca" placeholder="Buscar por nome, empresa, telefone ou pacote" aria-label="Buscar leads">
      <button class="chip is-on" type="button" data-f="todos">Todos</button>
      <button class="chip" type="button" data-f="retorno">Retornos pendentes</button>
    </div>
    <div class="list" id="list"></div>
    <p class="vazio" id="vazio" hidden>Nenhum lead por aqui ainda.</p>
  </main>
</div>

<!-- Ficha do lead -->
<div class="sheet" id="sheet" hidden>
  <form class="sheet-in" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetNome">
    <div class="sheet-head">
      <div><h2 id="sheetNome">Lead</h2><p id="sheetMeta"></p></div>
      <button class="x" type="button" id="sheetX" aria-label="Fechar">&#10005;</button>
    </div>
    <a class="btn btn-wa" id="waBtn" target="_blank" rel="noopener">Chamar no WhatsApp</a>
    <div class="two">
      <div class="field"><label for="fStatus">Status</label><select id="fStatus"></select></div>
      <div class="field"><label for="fRetorno">Próximo retorno</label><input id="fRetorno" type="date"></div>
    </div>
    <div class="field"><label for="fNotas">Anotações</label><textarea id="fNotas" placeholder="O que foi conversado, valores, próximos passos."></textarea></div>
    <div class="field" id="pedidoWrap"><label>O que a pessoa pediu</label><div class="pedido" id="fMsgView"></div></div>
    <div class="two">
      <div class="field"><label for="fNome">Nome</label><input id="fNome" required></div>
      <div class="field"><label for="fEmpresa">Empresa</label><input id="fEmpresa"></div>
    </div>
    <div class="two">
      <div class="field"><label for="fTel">WhatsApp</label><input id="fTel" type="tel"></div>
      <div class="field"><label for="fPacote">Pacote de interesse</label><select id="fPacote"></select></div>
    </div>
    <div class="two">
      <div class="field"><label for="fSeg">Tipo de projeto</label><select id="fSeg"></select></div>
      <div class="field"><label for="fQuando">Quando</label><select id="fQuando"></select></div>
    </div>
    <div class="field" id="msgEditWrap" hidden><label for="fMsg">O que a pessoa precisa</label><textarea id="fMsg"></textarea></div>
    <div class="sheet-actions">
      <button class="btn btn-danger" type="button" id="excluirBtn">Excluir lead</button>
      <span class="salvo" id="salvo" role="status"></span>
      <button class="btn btn-primary" type="submit" id="salvarBtn">Salvar</button>
    </div>
  </form>
</div>

<script>
(function(){
  var API = '../api/painel.php';
  var STATUS = [['novo','Novo'],['contato','Em contato'],['proposta','Proposta enviada'],['fechado','Fechado'],['perdido','Perdido']];
  var PACOTES = ['', 'Ainda não sei', 'Presença', 'Crescimento', 'Marca', 'Projeto sob medida'];
  var SEGS = ['', 'Evento ou projeto corporativo', 'Campanha política', 'Conteúdo mensal para meu negócio'];
  var QUANDOS = ['', 'Nas próximas 2 semanas', 'No próximo mês', 'Nos próximos 3 meses', 'Ainda sem data'];
  var csrf = '', leads = [], filtro = 'todos', busca = '', atual = null, modo = 'entrar';
  var $ = function(id){ return document.getElementById(id); };

  function api(a, body){
    var o = { credentials: 'same-origin', headers: {} };
    if (body !== undefined) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.headers['X-CSRF'] = csrf; o.body = JSON.stringify(body); }
    return fetch(API + '?a=' + a, o).then(function(r){
      return r.json().catch(function(){ return { ok:false, erro:'Resposta inesperada do servidor.' }; }).then(function(d){
        if (r.status === 401 && a !== 'entrar') { mostrarGate('entrar'); }
        return d;
      });
    }, function(){ return { ok:false, erro:'Sem conexão com o servidor.' }; });
  }
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function hojeISO(){ var d = new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
  function dataBR(iso){ if (!iso) return ''; var p = iso.slice(0,10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function nomeStatus(s){ for (var i=0;i<STATUS.length;i++) if (STATUS[i][0] === s) return STATUS[i][1]; return s; }
  function digitos(t){ var d = (t||'').replace(/\D+/g,''); if (!d) return ''; if (d.length <= 11) d = '55' + d; return d; }
  function opcoes(sel, lista, valor){
    sel.textContent = '';
    var tem = false;
    lista.forEach(function(v){ var o = el('option', '', Array.isArray(v) ? v[1] : (v || '—')); o.value = Array.isArray(v) ? v[0] : v; if (o.value === valor) tem = true; sel.appendChild(o); });
    if (valor && !tem) { var o = el('option', '', valor); o.value = valor; sel.appendChild(o); }
    sel.value = valor || '';
  }

  // Entrada
  function mostrarGate(m){
    modo = m;
    $('app').hidden = true; $('sheet').hidden = true; $('gate').hidden = false;
    var novo = m === 'configurar';
    $('gateTitle').textContent = novo ? 'Criar a senha do painel' : 'Entrar';
    $('gateText').textContent = novo ? 'Primeiro acesso. Escolha uma senha com pelo menos 10 caracteres e guarde em local seguro.' : 'Digite a senha do painel.';
    $('senha2Wrap').hidden = !novo;
    $('senha').autocomplete = novo ? 'new-password' : 'current-password';
    $('gateBtn').textContent = novo ? 'Criar senha e entrar' : 'Entrar';
    $('gateErro').textContent = ''; $('senha').value = ''; $('senha2').value = '';
    $('senha').focus();
  }
  $('gateForm').addEventListener('submit', function(e){
    e.preventDefault();
    var s = $('senha').value;
    if (modo === 'configurar') {
      if (s.length < 10) { $('gateErro').textContent = 'A senha precisa ter pelo menos 10 caracteres.'; return; }
      if (s !== $('senha2').value) { $('gateErro').textContent = 'As duas senhas não são iguais.'; return; }
    }
    $('gateBtn').disabled = true;
    api(modo, { senha: s }).then(function(d){
      $('gateBtn').disabled = false;
      if (!d.ok) { $('gateErro').textContent = d.erro || 'Não foi possível entrar.'; return; }
      csrf = d.csrf; abrirApp();
    });
  });

  // Lista
  function abrirApp(){ $('gate').hidden = true; $('app').hidden = false; carregar(); }
  function carregar(){ return api('leads').then(function(d){ if (d.ok) { leads = d.leads || []; desenhar(); } }); }
  function passa(l){
    if (filtro === 'retorno') { if (!l.retorno || l.retorno > hojeISO() || l.status === 'fechado' || l.status === 'perdido') return false; }
    else if (filtro !== 'todos' && l.status !== filtro) return false;
    if (busca) { var t = [l.nome,l.empresa,l.tel,l.pacote,l.seg,l.msg,l.notas].join(' ').toLowerCase(); if (t.indexOf(busca) < 0 && (l.tel||'').replace(/\D+/g,'').indexOf(busca.replace(/\D+/g,'') || '\u0000') < 0) return false; }
    return true;
  }
  function desenhar(){
    var stats = $('stats'); stats.textContent = '';
    STATUS.forEach(function(s){
      var n = leads.filter(function(l){ return l.status === s[0]; }).length;
      var b = el('button', 'stat' + (filtro === s[0] ? ' is-on' : '')); b.type = 'button'; b.style.setProperty('--c', 'var(--' + s[0] + ')');
      b.appendChild(el('b', '', String(n))); b.appendChild(el('span', '', s[1]));
      b.addEventListener('click', function(){ filtro = filtro === s[0] ? 'todos' : s[0]; desenhar(); });
      stats.appendChild(b);
    });
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('is-on', c.dataset.f === filtro); });
    var list = $('list'); list.textContent = '';
    var vis = leads.filter(passa), hoje = hojeISO();
    vis.forEach(function(l){
      var r = el('button', 'row'); r.type = 'button';
      var c1 = el('div'); c1.appendChild(el('div', 'n', l.nome || 'Sem nome')); c1.appendChild(el('div', 's', [l.empresa, l.tel].filter(Boolean).join(' · ') || '—'));
      var c2 = el('div', 'c2'); c2.appendChild(el('div', 's', l.pacote ? 'Pacote: ' + l.pacote : 'Pacote não informado')); c2.appendChild(el('div', 's', l.seg || '—'));
      var c3 = el('div', 'c3'); c3.appendChild(el('div', 's', 'Chegou em ' + dataBR(l.criado))); c3.appendChild(el('div', 's', l.campanha ? 'Origem: ' + l.campanha : (l.quando || '—')));
      var c4 = el('div', 'right'); var bd = el('span', 'badge', nomeStatus(l.status)); bd.style.setProperty('--c', 'var(--' + l.status + ')'); c4.appendChild(bd);
      if (l.retorno && l.status !== 'fechado' && l.status !== 'perdido') {
        var cls = l.retorno < hoje ? ' atrasado' : l.retorno === hoje ? ' hoje' : '';
        c4.appendChild(el('span', 'ret' + cls, (l.retorno < hoje ? 'Retorno atrasado: ' : l.retorno === hoje ? 'Retornar hoje' : 'Retorno: ') + (l.retorno === hoje ? '' : dataBR(l.retorno))));
      }
      r.appendChild(c1); r.appendChild(c2); r.appendChild(c3); r.appendChild(c4);
      r.addEventListener('click', function(){ abrirFicha(l); });
      list.appendChild(r);
    });
    $('vazio').hidden = vis.length > 0;
    $('vazio').textContent = leads.length ? 'Nenhum lead neste filtro.' : 'Nenhum lead por aqui ainda. Os envios do formulário do site aparecem nesta lista.';
  }
  document.querySelectorAll('.chip').forEach(function(c){ c.addEventListener('click', function(){ filtro = c.dataset.f; desenhar(); }); });
  $('busca').addEventListener('input', function(){ busca = this.value.trim().toLowerCase(); desenhar(); });

  // Ficha
  function abrirFicha(l){
    atual = l; var novo = !l;
    l = l || { status:'novo' };
    $('sheetNome').textContent = novo ? 'Novo lead' : (l.nome || 'Lead');
    $('sheetMeta').textContent = novo ? 'Cadastro manual' : ('Chegou em ' + dataBR(l.criado) + (l.origem === 'manual' ? ' · cadastro manual' : ' · pelo site') + (l.campanha ? ' · origem: ' + l.campanha : ''));
    opcoes($('fStatus'), STATUS, l.status || 'novo');
    opcoes($('fPacote'), PACOTES, l.pacote || ''); opcoes($('fSeg'), SEGS, l.seg || ''); opcoes($('fQuando'), QUANDOS, l.quando || '');
    $('fRetorno').value = l.retorno || ''; $('fNotas').value = l.notas || '';
    $('fNome').value = l.nome || ''; $('fEmpresa').value = l.empresa || ''; $('fTel').value = l.tel || '';
    $('fMsg').value = l.msg || ''; $('fMsgView').textContent = l.msg || 'Sem mensagem.';
    $('pedidoWrap').hidden = novo; $('msgEditWrap').hidden = !novo;
    $('excluirBtn').hidden = novo; $('salvo').textContent = '';
    atualizarWa();
    $('sheet').hidden = false; document.body.style.overflow = 'hidden';
    (novo ? $('fNome') : $('fStatus')).focus();
  }
  function atualizarWa(){
    var d = digitos($('fTel').value), nome = ($('fNome').value || '').trim().split(' ')[0];
    var b = $('waBtn');
    if (!d) { b.hidden = true; return; }
    b.hidden = false;
    b.href = 'https://wa.me/' + d + '?text=' + encodeURIComponent('Olá' + (nome ? ', ' + nome : '') + '! Aqui é da Pokan Filmes. Recebemos o seu contato pelo site.');
  }
  $('fTel').addEventListener('input', atualizarWa); $('fNome').addEventListener('input', atualizarWa);
  function fecharFicha(){ $('sheet').hidden = true; document.body.style.overflow = ''; atual = null; }
  $('sheetX').addEventListener('click', fecharFicha);
  $('sheet').addEventListener('click', function(e){ if (e.target === this) fecharFicha(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('sheet').hidden) fecharFicha(); });
  $('novoBtn').addEventListener('click', function(){ abrirFicha(null); });
  $('sheetForm').addEventListener('submit', function(e){
    e.preventDefault();
    var dados = { status:$('fStatus').value, retorno:$('fRetorno').value, notas:$('fNotas').value, nome:$('fNome').value, empresa:$('fEmpresa').value, tel:$('fTel').value, pacote:$('fPacote').value, seg:$('fSeg').value, quando:$('fQuando').value };
    var novo = !atual;
    if (novo) dados.msg = $('fMsg').value; else dados.id = atual.id;
    $('salvarBtn').disabled = true;
    api(novo ? 'criar' : 'atualizar', dados).then(function(d){
      $('salvarBtn').disabled = false;
      if (!d.ok) { $('salvo').style.color = '#FF8F8F'; $('salvo').textContent = d.erro || 'Não foi possível salvar.'; return; }
      if (novo) { leads.unshift(d.lead); fecharFicha(); }
      else { var i = leads.indexOf(atual); if (i >= 0) leads[i] = d.lead; atual = d.lead; $('sheetNome').textContent = d.lead.nome || 'Lead'; $('salvo').style.color = ''; $('salvo').textContent = 'Salvo.'; }
      desenhar();
    });
  });
  $('excluirBtn').addEventListener('click', function(){
    if (!atual || !confirm('Excluir o lead de ' + (atual.nome || 'sem nome') + '? Esta ação não pode ser desfeita.')) return;
    var alvo = atual;
    api('excluir', { id: alvo.id }).then(function(d){
      if (!d.ok) { $('salvo').style.color = '#FF8F8F'; $('salvo').textContent = d.erro || 'Não foi possível excluir.'; return; }
      leads = leads.filter(function(l){ return l !== alvo; }); fecharFicha(); desenhar();
    });
  });

  // Exportação para planilha (CSV com separador ponto e vírgula, abre direto no Excel e no Google Planilhas)
  $('csvBtn').addEventListener('click', function(){
    var cols = [['criado','Chegou em'],['status','Status'],['nome','Nome'],['empresa','Empresa'],['tel','WhatsApp'],['pacote','Pacote'],['seg','Tipo de projeto'],['quando','Quando'],['msg','Pedido'],['notas','Anotações'],['retorno','Próximo retorno'],['origem','Cadastro'],['campanha','Origem da visita']];
    function cel(v){ v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
    var linhas = [cols.map(function(c){ return cel(c[1]); }).join(';')];
    leads.forEach(function(l){ linhas.push(cols.map(function(c){ var v = l[c[0]]; if (c[0] === 'criado') v = dataBR(v); if (c[0] === 'retorno') v = dataBR(v); if (c[0] === 'status') v = nomeStatus(v); return cel(v); }).join(';')); });
    var blob = new Blob(['﻿' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'leads-pokan-' + hojeISO() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });

  $('sairBtn').addEventListener('click', function(){ api('sair', {}).then(function(){ csrf = ''; leads = []; mostrarGate('entrar'); }); });

  // Início
  api('estado').then(function(d){
    if (!d.ok) { $('gate').hidden = false; $('gateErro').textContent = d.erro || 'Painel indisponível.'; $('gateBtn').disabled = true; return; }
    $('httpAviso').hidden = !!d.https || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (d.logado) { csrf = d.csrf; abrirApp(); }
    else mostrarGate(d.configurado ? 'entrar' : 'configurar');
  });
})();
</script>
</body>
</html>
